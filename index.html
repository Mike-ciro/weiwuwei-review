<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>味无味 · 好评助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #C8965A;
    --primary-light: #E8D5B8;
    --primary-dark: #A07040;
    --bg: #FBF8F4;
    --card-bg: #FFFFFF;
    --text: #2C2418;
    --text-secondary: #8C7A62;
    --shadow: 0 4px 20px rgba(160,112,64,0.10);
    --radius: 16px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .header {
    background: linear-gradient(135deg, #C8965A 0%, #A07040 100%);
    padding: 40px 24px 50px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
  }
  .header .logo {
    font-size: 42px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 12px;
    position: relative;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header .tagline {
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    margin-top: 8px;
    letter-spacing: 4px;
    position: relative;
  }
  .container {
    max-width: 420px;
    margin: -30px auto 0;
    padding: 0 16px;
    position: relative;
  }
  .review-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 16px;
  }
  .review-card .label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .review-card .label span {
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 1px;
  }
  .review-card .label .dot {
    width: 6px; height: 6px;
    background: var(--primary);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .review-text {
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
    min-height: 100px;
    word-break: break-all;
  }
  .star-row {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 12px;
  }
  .star-row .star {
    font-size: 18px;
    color: #F5A623;
  }
  .star-row .rating-text {
    font-size: 12px;
    color: var(--text-secondary);
    margin-left: 8px;
  }
  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .btn {
    flex: 1;
    height: 44px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.96); }
  .btn-copy {
    background: var(--primary);
    color: #fff;
  }
  .btn-refresh {
    background: var(--primary-light);
    color: var(--primary-dark);
  }
  .platform-section {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 16px;
  }
  .platform-section .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .platform-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .platform-btn {
    height: 52px;
    border: 1.5px solid #eee;
    border-radius: 12px;
    background: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .platform-btn:active { transform: scale(0.96); background: #f9f6f2; }
  .platform-btn .icon { font-size: 20px; }
  .platform-btn.dianping { border-color: #FF6633; color: #FF6633; }
  .platform-btn.meituan { border-color: #FFD100; color: #E6A800; }
  .platform-btn.douyin { border-color: #111; color: #111; }
  .platform-btn.xiaohongshu { border-color: #FF2442; color: #FF2442; }
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.78);
    color: #fff;
    padding: 16px 32px;
    border-radius: 12px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    z-index: 999;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .tips {
    text-align: center;
    padding: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.8;
  }
  .tips .step {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: 0 4px;
  }
  .tips .num {
    width: 18px;
    height: 18px;
    background: var(--primary-light);
    color: var(--primary-dark);
    border-radius: 50%;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
  }
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: #ccc;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="header">
  <div class="logo">味无味</div>
  <div class="tagline">感谢您的用餐 · 期待您的好评</div>
</div>
<div class="container">
  <div class="review-card">
    <div class="label">
      <div class="dot"></div>
      <span>AI 已为您生成专属评价</span>
    </div>
    <div class="star-row">
      <span class="star">★</span>
      <span class="star">★</span>
      <span class="star">★</span>
      <span class="star">★</span>
      <span class="star">★</span>
      <span class="rating-text">五星好评</span>
    </div>
    <div class="review-text" id="reviewText"></div>
    <div class="btn-group">
      <button class="btn btn-copy" onclick="copyReview()">📋 复制评价</button>
      <button class="btn btn-refresh" onclick="generateReview()">🔄 换一条</button>
    </div>
  </div>
  <div class="platform-section">
    <div class="section-title">📱 选择平台去发布</div>
    <div class="platform-grid">
      <button class="platform-btn dianping" onclick="openPlatform('dianping')">
        <span class="icon">🔶</span> 大众点评
      </button>
      <button class="platform-btn meituan" onclick="openPlatform('meituan')">
        <span class="icon">🟡</span> 美团
      </button>
      <button class="platform-btn douyin" onclick="openPlatform('douyin')">
        <span class="icon">🎵</span> 抖音
      </button>
      <button class="platform-btn xiaohongshu" onclick="openPlatform('xiaohongshu')">
        <span class="icon">📕</span> 小红书
      </button>
    </div>
  </div>
  <div class="tips">
    <span class="step"><span class="num">1</span> 点击复制评价</span> →
    <span class="step"><span class="num">2</span> 选择平台</span> →
    <span class="step"><span class="num">3</span> 粘贴发布</span>
    <br>评价已复制到剪贴板，打开App直接粘贴即可 ❤️
  </div>
  <div class="footer">味无味 · 好评助手</div>
</div>
<div class="toast" id="toast"></div>

};

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

let lastReview = '';

function generateReview() {
  let review = '';
  let attempts = 0;
  do {
    const opening = pick(templates.openings);
    const dish = pick(templates.dishes);
    const amb = Math.random() > 0.3 ? pick(templates.ambience) : '';
    const svc = Math.random() > 0.3 ? pick(templates.service) : '';
    const ending = pick(templates.endings);
    const parts = [opening, dish];
    if (amb) parts.push(amb);
    if (svc) parts.push(svc);
    parts.push(ending);
    review = parts.join('');
    attempts++;
  } while (review === lastReview && attempts < 10);
  lastReview = review;
  const el = document.getElementById('reviewText');
  el.textContent = '';
  let i = 0;
  const timer = setInterval(() => {
    if (i < review.length) {
      el.textContent += review[i];
      i++;
    } else {
      clearInterval(timer);
    }
  }, 25);
}

function copyReview() {
  const text = document.getElementById('reviewText').textContent;
  if (!text) { showToast('请先等待评价生成完毕'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('✅ 评价已复制\n请选择平台去粘贴发布');
    }).catch(() => { fallbackCopy(text); });
  } else { fallbackCopy(text); }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('✅ 评价已复制\n请选择平台去粘贴发布');
  } catch (e) {
    showToast('❌ 复制失败，请长按文字手动复制');
  }
  document.body.removeChild(ta);
}

function openPlatform(platform) {
  const text = document.getElementById('reviewText').textContent;
  if (text && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => {});
  }
  const schemes = {
    dianping: { app: 'dianping://shopDetail', web: 'https://m.dianping.com/', name: '大众点评' },
    meituan: { app: 'imeituan://www.meituan.com/', web: 'https://i.meituan.com/', name: '美团' },
    douyin: { app: 'snssdk1128://', web: 'https://www.douyin.com/', name: '抖音' },
    xiaohongshu: { app: 'xhsdiscover://', web: 'https://www.xiaohongshu.com/', name: '小红书' }
  };
  const p = schemes[platform];
  showToast('📋 评价已复制\n正在打开' + p.name + '...\n打开后粘贴发布即可');
  const start = Date.now();
  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = p.app;
  document.body.appendChild(iframe);
  setTimeout(() => {
    document.body.removeChild(iframe);
    if (Date.now() - start < 2500) { window.location.href = p.web; }
  }, 2000);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.classList.remove('show'); }, 2500);
}

window.addEventListener('DOMContentLoaded', generateReview);
</script>
</body>
</html>
